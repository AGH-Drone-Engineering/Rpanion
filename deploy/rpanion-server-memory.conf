# Drop-in for rpanion-server.service (also covers its children: mavlink-router, video).
# When memory runs out the kernel OOM killer picks the process with the highest score;
# -900 keeps Rpanion out of that choice so the largest other process (main.py) goes.
# MemoryLow keeps its pages in RAM while the kernel reclaims memory before the kill;
# system.slice needs the same protection (rpanion-system-slice.conf), otherwise it has no effect.
[Service]
OOMScoreAdjust=-900
MemoryLow=512M
