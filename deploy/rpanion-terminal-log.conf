# -o: one pipe per pane when several grouped sessions run the same hook
set-hook -g session-created 'pipe-pane -o "exec /usr/local/lib/rpanion-terminal/log-pane.py #{pid} #{pane_id}"'
set-hook -g after-new-window 'pipe-pane -o "exec /usr/local/lib/rpanion-terminal/log-pane.py #{pid} #{pane_id}"'
set-hook -g after-split-window 'pipe-pane -o "exec /usr/local/lib/rpanion-terminal/log-pane.py #{pid} #{pane_id}"'
