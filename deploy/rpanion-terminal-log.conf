# Only unpiped panes: pipe-pane -o toggles an existing pipe off
set-hook -g session-created { if -F '#{!=:#{pane_pipe},1}' { pipe-pane 'exec /usr/local/lib/rpanion-terminal/log-pane.py #{pid} #{pane_id}' } }
set-hook -g after-new-window { if -F '#{!=:#{pane_pipe},1}' { pipe-pane 'exec /usr/local/lib/rpanion-terminal/log-pane.py #{pid} #{pane_id}' } }
set-hook -g after-split-window { if -F '#{!=:#{pane_pipe},1}' { pipe-pane 'exec /usr/local/lib/rpanion-terminal/log-pane.py #{pid} #{pane_id}' } }
