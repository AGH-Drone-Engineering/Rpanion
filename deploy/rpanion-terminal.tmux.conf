set -g status off
# Mouse off: selecting text is left to the browser (xterm.js). With tmux mouse mode a drag
# selects inside tmux and is cleared on release, and tmux cannot reach the browser clipboard
# over plain HTTP. The web terminal turns the mouse wheel into these two keys instead
# (src/terminalKeys.js): history scroll in copy mode, or arrow keys for full-screen programs.
set -g mouse off
set -s user-keys[0] "\e[42001~"
set -s user-keys[1] "\e[42002~"
bind -n User0 if -F '#{alternate_on}' { send-keys -N 3 Up } { copy-mode -e ; send-keys -X -N 3 scroll-up }
bind -n User1 if -F '#{alternate_on}' { send-keys -N 3 Down } { if -F '#{pane_in_mode}' { send-keys -X -N 3 scroll-down } }
set -g history-limit 5000
set -g window-size latest
set -g exit-empty off
# The default 500 ms delays Escape in editors
set -sg escape-time 10
# Set for the panes only. With these variables in the server's own environment tmux moves each
# pane into a separate systemd scope outside the unit, where the stop script cannot find it.
set-environment -g XDG_RUNTIME_DIR /run/user/1000
set-environment -g DBUS_SESSION_BUS_ADDRESS unix:path=/run/user/1000/bus
source-file -q /etc/rpanion-server/terminal-log.conf
