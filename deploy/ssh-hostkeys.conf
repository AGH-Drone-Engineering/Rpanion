# Drop-in for ssh.service, installed as
# /etc/systemd/system/ssh.service.d/rpanion-hostkeys.conf
# Images are created without SSH host keys (deploy/create_image.sh). Their
# /etc/machine-id is empty, which systemd does not treat as a first boot, so
# regenerate_ssh_host_keys.service and sshd-keygen.service are skipped.
# ssh-keygen -A creates only missing keys. The list is reset to keep the
# config test after key generation.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
